[package]
name = "doghttpclient"
version = "0.1.0"
description = "dogHttpClient - A lightweight API testing tool"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1", features = [ "fs-write-file", "path-all", "fs-read-file", "fs-create-dir", "fs-read-dir", "fs-exists", "shell-open", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
